			grid-template-columns: repeat(2, 1fr);
		}

		.kaoru-gallery a {
			display: block;
			position: relative;
			width: 100%;
			aspect-ratio: 4 / 3;
			overflow: hidden;
			border: 1px solid #e0e0e0;
			padding: 2px;
			background: #fff;
			box-sizing: border-box;
		}

		.kaoru-gallery img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
			transition: transform 0.3s ease;
		}

		.kaoru-gallery a:hover img {
			transform: scale(1.05);
		}

	<!-- 引入 GLightbox 核心檔案 -->

	<!-- 啟用燈箱與手機選單 -->
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			var imageLinks = document.querySelectorAll('a[href$=".jpg"], a[href$=".jpeg"], a[href$=".png"], a[href$=".gif"]');
			imageLinks.forEach(function (link) {
				link.classList.add('glightbox');
			});
			const lightbox = GLightbox({
				selector: '.glightbox',
				touchNavigation: true,
				loop: true
			});

			var menuBtn = document.querySelector('a[aria-label="Menu"]');
			if (menuBtn) {
				var menuWrapper = menuBtn.nextElementSibling;
				if (menuWrapper) {
					menuWrapper.classList.add('custom-mobile-menu');
					menuBtn.addEventListener('click', function (event) {
						event.preventDefault();
						menuWrapper.classList.toggle('is-open');
					});
				}
			}
		});
	</script>
